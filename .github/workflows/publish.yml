name: Quarto Publish

on:
  schedule:
    - cron: "59 12 * * 5-6"

  workflow_dispatch:

  push:
    branches:
      - "master"

jobs:
  update-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: true
          packages: |
            any::data.table
            any::dplyr
            any::gt
            any::ggplot2
            any::scales
            any::tidyr
            any::corrplot
            any::gridExtra
            any::readr
            any::tidyverse
            any::DT
            any::ggrepel
            any::viridis
            any::patchwork

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto
        run: quarto render --fail-if-warnings

      - name: Commit changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add --all
          git diff --cached --quiet || git commit -m "Update generated report"
          git push

      - name: Render and Publish to Netlify
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: netlify
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

# Optional if using renv
#      - name: Restore renv
